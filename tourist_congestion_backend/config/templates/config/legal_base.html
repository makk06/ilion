<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · 이리ON</title>
<style>
  :root { color-scheme: light dark; --fg:#17291f; --muted:#5c6a61; --bg:#ffffff; --line:#dee5de; --accent:#2e4636; --soft:#f2f6f1; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6eee8; --muted:#a2b0a7; --bg:#111512; --line:#2c352f; --accent:#a1cfac; --soft:#18201a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); line-height:1.75;
         font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 96px; }
  h1 { font-size:1.6rem; line-height:1.35; margin:0 0 6px; }
  h2 { font-size:1.08rem; margin:36px 0 10px; padding-top:22px; border-top:1px solid var(--line); }
  h3 { font-size:.98rem; margin:22px 0 8px; }
  p, li, td, th { font-size:.94rem; }
  .meta { color:var(--muted); font-size:.85rem; margin:0 0 20px; }
  .note { background:var(--soft); border-left:3px solid var(--accent); padding:12px 14px; margin:14px 0; border-radius:4px; }
  .table-wrap { overflow-x:auto; margin:12px 0; }
  table { border-collapse:collapse; width:100%; min-width:420px; }
  th, td { border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top; }
  th { font-weight:600; background:var(--soft); }
  ul, ol { padding-left:20px; }
  a { color:var(--accent); }
  footer { margin-top:48px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>
  운영: {{ operator_name }} (대표 {{ representative_name }}) · 문의: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a><br>
  <a href="/privacy">개인정보 처리방침</a> · <a href="/terms">서비스 이용약관</a>
</footer>
</main>
</body>
</html>
