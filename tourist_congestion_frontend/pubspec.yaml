name: tourist_congestion_frontend
description: 실시간 혼잡도 기반 장소 추천 앱의 Flutter 프런트엔드 기본 틀
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  flutter_map_vector_tiles: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/simple.json
