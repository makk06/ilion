name: Bootstrap ILION container package

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of the reviewed ILION deployment branch
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Require an immutable source revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test the ARM64 backend
        run: sh scripts/check-backend.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bootstrap linked package
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/hurdoo/ilion:bootstrap-${{ inputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/hurdoo/ilion
            org.opencontainers.image.revision=${{ inputs.revision }}
